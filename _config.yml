title: 게임 개발 블로그
email:
description: >- # this means to ignore newlines until "baseurl:"
  Write an awesome description for your new site here. You can edit this
  line in _config.yml. It will appear in your document head meta (for
  Google search results) and in your feed.xml site description.
twitter_username: username
github_username: username
minimal_mistakes_skin: default
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Insoo Moon"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "게임 클라이언트 개발자 지망생입니다."
  links:
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/@%EB%AC%B8%EC%9D%B8%EC%88%98-i3t/playlists/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/InsooMoon99/"
    - label: "Email - insoo9322@gmail.com"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:insoo9322@gmail.com"

footer:
  links:
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/@%EB%AC%B8%EC%9D%B8%EC%88%98-i3t/playlists/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/InsooMoon99/"
    - label: "Email - insoo9322@gmail.com"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:insoo9322@gmail.com"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
